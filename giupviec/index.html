<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang tải...</title>
    <script src="../shared/api.js?v=20260519"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var token = ChiOiAuth.getToken();
            var user = ChiOiAuth.getUser();
            if (token && user && user.role === 'TASKER') {
                window.location.replace('trangchutasker.html');
            } else {
                // Kiểm tra xem đã xem màn hình giới thiệu chưa
                var introduced = localStorage.getItem('chioi_tasker_introduced');
                if (introduced === 'true') {
                    window.location.replace('dangnhaptasker.html');
                } else {
                    window.location.replace('gioithieu.html');
                }
            }
        });
    </script>
</head>
<body style="background:#fff8f6;"><script src="../shared/global-notifications.js" defer></script>
</body>
</html>
